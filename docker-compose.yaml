version: "3.9"

services:
  backend:
    build: .
    container_name: collabspace-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - mongo
      - redis
    volumes:
      - .:/app
      - /app/node_modules
    restart: unless-stopped

  mongo:
    image: mongo:6
    container_name: collabspace-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: collabspace-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  mongo-data:
