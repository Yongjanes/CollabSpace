version: "3.9"

services:
  backend:
    build: .
    container_name: collabspace-backend
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=mongodb://mongo:27017/CollabSpaceDB
      - REDIS_URL=redis://localhost:6379
      - NODE_ENV=development
      - PORT=8000
    env_file:
      - .env
    depends_on:
      - mongo
      - redis
    volumes:
      - .:/app
      - /app/node_modules
    restart: unless-stopped

  mongo:
    image: mongo:6
    container_name: collabspace-mongo
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: collabspace-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  mongo-data:
