openapi: 3.0.0

info:
  title: Workspace Collaboration API
  description: |
    Backend API for managing workspaces, members, tasks, and comments.
    Includes role-based permissions and authentication.
  version: 1.0.0

servers:
  - url: http://localhost:8000/api/v1
    description: Local development server
  - url: https://collabspace-k444.onrender.com/api/v1
    description: Server hosted on render, hosted and maintained by rohit


tags:
  - name: Auth
    description: Authentication & authorization
  - name: Workspaces
    description: Workspace management
  - name: Members
    description: Workspace members & roles
  - name: Tasks
    description: Task management
  - name: Comments
    description: Task comments
  - name: Users
    description: User profile & dashboard data

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    User:
      type: object
      properties:
        _id:
          type: string
          description: MongoDB ObjectId
          example: "64a7f0c2e4b0c8b1a2d3e4f5"
        name:
          type: string
          example: Alice
        email:
          type: string
          format: email
          example: alice@example.com
    Workspace:
      type: object
      properties:
        _id: 
          type: string
          description: MongoDB ObjectId
          example: "64a7f0c2e4b0c8b1a2d3e4f5"
        name:
          type: string
          example: Backend Engineering Team
        description:
          type: string
          example: Workspace for backend engineers
        createdBy:
          type: string
          description: MongoDB ObjectId of the creator
          example: "64a7f0c2e4b0c8b1a2d3e4f5"
        createdAt:
          type: string
          format: date-time
          example: "2024-12-29T10:30:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2024-12-29T10:30:00Z"
    WorkspaceMember:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        role:
          type: string
          enum: [owner, admin, member, viewer]
          example: member
        joinedAt:
          type: string
          format: date-time
          example: "2024-12-29T10:30:00Z"
    Task:
      type: object
      properties:
        _id:
          type: string
          description: MongoDB ObjectId
          example: "64a7f0c2e4b0c8b1a2d3e4f5"
        workspaceId:
          type: string
          description: MongoDB ObjectId
          example: "64a7f0c2e4b0c8b1a2d3e4f5"
        title:
          type: string
          example: Implement authentication
        description:
          type: string
          example: Add JWT-based auth middleware
        status:
          type: string
          enum: [todo, in-progress, done]
          example: todo
        priority:
          type: string
          enum: [low, medium, high]
          example: medium
        assignedTo:
          $ref: '#/components/schemas/User'
          nullable: true
        createdBy:
          $ref: '#/components/schemas/User'
        createdAt:
          type: string
          format: date-time
          example: "2024-12-29T10:30:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2024-12-29T10:30:00Z"
    Comment:
      type: object
      properties:
        _id: 
          type: string
          description: MongoDB ObjectId
          example: "64a7f0c2e4b0c8b1a2d3e4f5"
        taskId:
          type: string
          description: MongoDB ObjectId
          example: "64a7f0c2e4b0c8b1a2d3e4f5"
        workspaceId:
          type: string
          description: MongoDB ObjectId
          example: "64a7f0c2e4b0c8b1a2d3e4f5"
        author:
          $ref: '#/components/schemas/User'
        content:
          type: string
          example: We should refactor this logic.
        createdAt:
          type: string
          format: date-time
          example: "2024-12-29T10:30:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2024-12-29T10:30:00Z"
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
        message:
          type: string
          example: "Operation completed successfully"
    ApiResponseWorkspace:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Workspace'
    ApiResponseWorkspaceArray:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                type: object
                properties:
                  workspace:
                    $ref: '#/components/schemas/Workspace'
                  role:
                    type: string
                    enum: [owner, admin, member, viewer]
    ApiResponseWorkspaceWithRole:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                workspace:
                  $ref: '#/components/schemas/Workspace'
                role:
                  type: string
                  enum: [owner, admin, member, viewer]
    ApiResponseWorkspaceMember:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/WorkspaceMember'
    ApiResponseWorkspaceMemberArray:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/WorkspaceMember'
    ApiResponseTask:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Task'
    ApiResponseTaskArray:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Task'
    ApiResponseComment:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Comment'
    ApiResponseCommentArray:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Comment'
    ApiResponseDashboard:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                user:
                  type: object
                  properties:
                    id: {type: string}
                    name: {type: string}
                    email: {type: string}
                workspaces:
                  type: array
                  items:
                    type: object
                    properties:
                      role: {type: string}
                      workspace: {$ref: '#/components/schemas/Workspace'}
                      joinedAt: {type: string, format: date-time}
                recentTasks:
                  type: array
                  items:
                    type: object
                    properties:
                      id: {type: string}
                      title: {type: string}
                      status: {type: string}
                      priority: {type: string}
                      workspaceName: {type: string}
                      workspaceId: {type: string}
                      createdAt: {type: string, format: date-time}

security:
  - bearerAuth: []

paths:
  /workspaces:
    post:
      tags:
        - Workspaces
      summary: Create a workspace
      description: Create a new workspace. The authenticated user becomes the owner.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  example: Backend Engineering Team
                description:
                  type: string
                  example: Workspace for backend engineers
      responses:
        201:
          description: Workspace created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseWorkspace'
        400:
          description: Workspace name is required
        401:
          description: Unauthorized
        409:
          description: Workspace with the same name already exists
    get:
      tags:
        - Workspaces
      summary: Get my workspaces
      description: Fetch all workspaces the authenticated user is a member of
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
      responses:
        200:
          description: Workspaces fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseWorkspaceArray'
        401:
          description: Unauthorized
  /workspaces/{id}:
    get:
      tags:
        - Workspaces
      summary: Get workspace by ID
      description: Fetch a workspace if the authenticated user is a member.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Workspace ID
          schema:
            type: string
            example: "64a7f0c2e4b0c8b1a2d3e4f5"
      responses:
        200:
          description: Workspace fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseWorkspaceWithRole'
        400:
          description: Invalid workspace ID
        401:
          description: Unauthorized
        403:
          description: User is not a member of this workspace
        404:
          description: Workspace not found
    patch:
      tags:
        - Workspaces
      summary: Update workspace
      description: |
        Update workspace details.
        Only owners and admins can update a workspace.
        Only owners can archive a workspace.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Workspace ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Backend Team
                description:
                  type: string
                  example: Updated description
      responses:
        200:
          description: Workspace updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseWorkspace'
        400:
          description: Invalid request
        401:
          description: Unauthorized
        403:
          description: Insufficient permissions
        404:
          description: Workspace not found
    delete:
      tags:
        - Workspaces
      summary: Delete Workspace Permanently
      description: Permanently delete a workspace and all its associated data (members, tasks, comments, activity logs). Only owners can perform this action.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Workspace ID
          schema:
            type: string
      responses:
        200:
          description: Workspace and all associated records deleted permanently
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        401:
          description: Unauthorized
        403:
          description: Only owners can delete workspaces
        404:
          description: Workspace not found
  /workspaces/{id}/activity:
    get:
      tags:
        - Workspaces
      summary: Get workspace activity log
      description: Fetch activity log for a workspace with pagination
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Workspace ID
          schema: 
            type: string
        - name: page
          in: query
          required: false
          schema: 
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          schema: 
            type: integer
            default: 10
      responses:
        200:
          description: Workspace activity fetched successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: 
                        type: array
                        items:
                          type: object
                          properties:
                            actorId:
                              $ref: '#/components/schemas/User'
                            action:
                              type: string
                            createdAt: 
                              type: string
                              format: date-time
        400:
          description: Invalid workspace ID
        401:
          description: Unauthorized
        403:
          description: User is not a member of this workspace
        404: 
          description: Workspace not found
  /workspaces/{id}/members:
    post:
      tags:
        - Members
      summary: Add member to workspace
      description: Add a user to the workspace with a specific role.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Workspace ID
          schema: 
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userId
              properties:
                userId:
                  type: string
                  description: MongoDB ObjectId of the user (Either userId or email is required)
                  example: "64a7f0c2e4b0c8b1a2d3e4f5"
                email:
                  type: string
                  format: email
                  description: Email of the user to add (Alternative to userId)
                  example: "user@example.com"
                role:
                  type: string
                  enum: [owner, admin, member, viewer]
                  example: member
      responses:
        201:
          description: Member added to workspace successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseWorkspaceMember'
        400:
          description: Invalid request or invalid role
        401:
          description: Unauthorized
        403:
          description: |
            Insufficient workspace permissions.
            Admins cannot assign the `owner` role — only owners can grant ownership.
        404:
          description: Workspace or user not found
        409:
          description: User is already a member of the workspace
    get:
      tags:
        - Members
      summary: Get workspace Members
      description: Fetch all members of a workspace
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Workspace ID
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
      responses:
        200:
          description: Workspace members fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseWorkspaceMemberArray'
        400:
          description: Invalid workspace ID
        401: 
          description: Unauthorized
        403:
          description: User is not a member of this workspace
        404:
          description: Workspace not found
  /workspaces/{id}/members/{userId}:
    patch:
      tags:
        - Members
      summary: Update workspace member role
      description: |
        Update the role of a workspace member.
        Only owners and admins can perform this action.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Workspace ID
          schema:
            type: string
        - name: userId
          in: path
          required: true
          description: Target user ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - role
              properties:
                role:
                  type: string
                  enum: [owner, admin, member, viewer]
                  example: admin
      responses:
        200:
          description: Workspace member role updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseWorkspaceMember'
        400:
          description: Invalid request
        401:
          description: Unauthorized
        403:
          description: Insufficient workspace permissions
        404:
          description: Member not found
    delete:
      tags:
        - Members
      summary: Remove workspace member
      description: |
        Remove a user from the workspace.
        Users may remove themselves.
        Owners and admins may remove other members.
      security: 
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Workspace ID
          schema:
            type: string
        - name: userId
          in: path
          required: true
          description: Target User ID
          schema:
            type: string
      responses:
        200:
          description: Member removed from workspace successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        400:
          description: Invalid request
        401:
          description: Unauthorized 
        403: 
          description: Insufficient workspace permissions
        404:
          description: Member not found
  /tasks:
    post:
      tags:
        - Tasks
      summary: Create a task
      description: |
        Create a new task inside a workspace.
        Viewers are not allowed to create tasks.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - workspaceId
                - title
              properties:
                workspaceId:
                  type: string
                  example: 64f1abc123
                title:
                  type: string
                  example: Implement authentication
                description:
                  type: string
                  example: Add JWT-based auth middleware
                priority:
                  type: string
                  enum: [low, medium, high]
                  example: medium
                assignedTo:
                  type: string
                  example: 64e9user123
      responses:
        201:
          description: Task created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseTask'
        400:
          description: Invalid request
        401:
          description: Unauthorized
        403:
          description: Viewers cannot create tasks
        404:
          description: Workspace not found or inactive
    get:
      tags:
        - Tasks
      summary: Get tasks
      description: Fetch tasks for a workspace with optional filters.
      security:
        - bearerAuth: []
      parameters:
        - name: workspaceId
          in: query
          required: true
          description: Workspace ID
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [todo, in-progress, done]
        - name: priority
          in: query
          required: false
          schema:
            type: string
            enum: [low, medium, high]
        - name: assignedTo
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
      responses:
        200:
          description: Tasks fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseTaskArray'
        400:
          description: Invalid query parameters
        401:
          description: Unauthorized
        403:
          description: User is not a member of this workspace
        404:
          description: Workspace not found or inactive
  /tasks/{id}:
    get:
      tags:
        - Tasks
      summary: Get task details
      description: Fetch details of a single task by its ID.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Task ID
          schema:
            type: string
      responses:
        200:
          description: Task details fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseTask'
        400:
          description: Invalid task ID
        401:
          description: Unauthorized
        403:
          description: User is not a member of the workspace
        404:
          description: Task not found
    patch:
      tags:
        - Tasks
      summary: Update task
      description: Update task details such as title, status, priority, or assignee.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Task ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                status:
                  type: string
                  enum: [todo, in-progress, done]
                priority:
                  type: string
                  enum: [low, medium, high]
                assignedTo:
                  type: string
                  nullable: true
      responses:
        200:
          description: Task updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseTask'
        400:
          description: Invalid request
        401:
          description: Unauthorized
        403:
          description: Viewers cannot update tasks
        404:
          description: Task or workspace not found
    delete:
      tags:
        - Tasks
      summary: Delete task
      description: Delete a task from a workspace.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Task ID
          schema:
            type: string
      responses:
        200:
          description: Task deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        401:
          description: Unauthorized
        403:
          description: Viewers cannot delete tasks
        404:
          description: Task or workspace not found
  /tasks/{id}/comments:
    post:
      tags:
        - Comments
      summary: Add comment to task
      description: Add a new comment to a task.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Task ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - content
              properties:
                content:
                  type: string
                  example: We should refactor this logic.
      responses:
        201:
          description: Comment created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseComment'
        400:
          description: Invalid request
        401:
          description: Unauthorized
        403:
          description: User is not allowed to comment on this task
        404:
          description: Task or workspace not found
    get:
      tags:
        - Comments
      summary: Get task comments
      description: Fetch all comments associated with a task.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Task ID
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
      responses:
        200:
          description: Comments fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseCommentArray'
        400:
          description: Invalid task ID
        401:
          description: Unauthorized
        403:
          description: User is not a member of this workspace
        404:
          description: Task or workspace not found
  /tasks/{id}/comments/{commentId}:
    patch:
      tags:
        - Comments
      summary: Update comment
      description: Update the content of a comment. Only the comment author can edit.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Task ID
          schema:
            type: string
        - name: commentId
          in: path
          required: true
          description: Comment ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - content
              properties:
                content:
                  type: string
                  example: Updated comment content.
      responses:
        200:
          description: Comment updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseComment'
        400:
          description: Invalid request
        401:
          description: Unauthorized
        403:
          description: You can only edit your own comments
        404:
          description: Comment or task not found
    delete:
      tags:
        - Comments
      summary: Delete comment
      description: |
        Delete a comment.
        Comment authors may delete their own comments.
        Workspace owners and admins may delete any comment.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Task ID
          schema:
            type: string
        - name: commentId
          in: path
          required: true
          description: Comment ID
          schema:
            type: string
      responses:
        200:
          description: Comment deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        400:
          description: Invalid request
        401:
          description: Unauthorized
        403:
          description: Insufficient permissions to delete comment
        404:
          description: Comment or task not found
  /auth/register:
    post:
      tags:
        - Auth
      summary: Register a new user
      description: Create a new user account with email and password
      requestBody:
        required: true
        content: 
          application/json:
            schema: 
              type: object
              required:
                - name
                - email
                - password
              properties:
                name: 
                  type: string
                  example: John Doe
                email:
                  type: string
                  example: john@example.com
                password:
                  type: string
                  format: password
                  example: securePassword123
      responses:
        201:
          description: User registered successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          id:
                            type: string
                          name:
                            type: string
        400:
          description: Missing required fields
        409:
          description: User already exists
  /auth/login:
    post: 
      tags:
        - Auth
      summary: Login user
      description: |
        Authenticate user and return both access and refresh tokens.
        The refresh token is also set as an `httpOnly` cookie for web clients.
        Mobile clients should store the `refreshToken` from the response body securely (e.g. Keychain / SecureStore).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: 
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: john@example.com
                password:
                  type: string
                  format: password
                  example: securePassword123
      responses:
        200:
          description: Login successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          accessToken:
                            type: string
                            description: Short-lived JWT access token
                            example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                          refreshToken:
                            type: string
                            description: Long-lived refresh token (also set as httpOnly cookie for web)
                            example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        400:
          description: Missing email and password
        401:
          description: Invalid credentials
        403: 
          description: User account is inactive
  /auth/refresh:
    post:
      tags:
        - Auth
      summary: Refresh access token
      description: |
        Issue a new access token and rotate the refresh token.
        The refresh token can be provided via:
        - `httpOnly` cookie (`refresh_token`) — web clients
        - Request body (`refreshToken`) — mobile clients
        The old refresh token is invalidated on use. If a reused token is detected, all sessions are wiped.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
                  description: Refresh token (for mobile clients — web clients use the cookie)
                  example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
      responses:
        200:
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          accessToken:
                            type: string
                            description: New JWT access token
                            example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                          refreshToken:
                            type: string
                            description: New refresh token (rotated — store and use this going forward)
                            example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        401:
          description: Refresh token missing, invalid, expired, or reuse detected
  /auth/logout:
    post:
      tags:
        - Auth
      summary: Logout user
      description: |
        Invalidate the current refresh token and clear the cookie.
        The refresh token can be provided via:
        - `httpOnly` cookie (`refresh_token`) — web clients
        - Request body (`refreshToken`) — mobile clients
        If no refresh token is provided, the request still succeeds (idempotent).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
                  description: Refresh token to invalidate (for mobile clients)
                  example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
      responses:
        200:
          description: Logged out successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /auth/me:
    get:
      tags:
        - Auth
      summary: Get current user profile
      description: Fetch the authenticated user's profile information.
      security:
        - bearerAuth: []
      responses:
        200:
          description: User profile fetched successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
        401:
          description: Unauthorized
  /users/dashboard:
    get:
      tags:
        - Users
      summary: Get user dashboard data
      description: |
        Fetch aggregated data for the user dashboard.
        Includes user profile, workspaces, and recent assigned tasks.
      security:
        - bearerAuth: []
      responses:
        200:
          description: Dashboard data fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseDashboard'
        401:
          description: Unauthorized
  /users/tasks:
    get:
      tags:
        - Users
      summary: Get user-relevant tasks
      description: |
        Fetch all tasks in workspaces the user is a member of.
        Default filters to 'todo' and 'in-progress' statuses for an overview.
        Supports filtering by status and priority (comma-separated).
        Use `assignedToMe=true` to narrow down to personal tasks.
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          description: Comma-separated list of statuses (e.g., todo,in-progress)
          schema:
            type: string
        - name: priority
          in: query
          required: false
          description: Comma-separated list of priorities (e.g., high,medium)
          schema:
            type: string
        - name: assignedToMe
          in: query
          required: false
          description: Filter only tasks assigned to the current user
          schema:
            type: boolean
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
      responses:
        200:
          description: User tasks fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          allOf:
                            - $ref: '#/components/schemas/Task'
                            - type: object
                              properties:
                                workspaceId:
                                  type: object
                                  properties:
                                    name:
                                      type: string
                      meta:
                        type: object
                        properties:
                          page:
                            type: integer
                          limit:
                            type: integer
                          totalItems:
                            type: integer
                          totalPages:
                            type: integer
                  message:
                    type: string
        401:
          description: Unauthorized







